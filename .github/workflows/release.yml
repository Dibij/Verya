name: Release Verya

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.2.3)'
        required: true
        default: 'v0.2.3'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build and Package Artifacts
        run: |
          npm run build
          npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: Verya ${{ github.ref_name || github.event.inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/verya-linux-x64.tar.gz
            dist-release/verya-linux-arm64.tar.gz
            dist-release/verya-macos-x64.tar.gz
            dist-release/verya-macos-arm64.tar.gz
            dist-release/verya-windows-x64.zip
            dist-release/install.sh
            dist-release/install.ps1
            dist-release/VeryaSetup.cmd
            dist-release/checksums.txt
